<body>
  <div class="safe-area-bg"></div>
  <div class="save-indicator" id="saveIndicator">💾 saving…</div>
  <div class="offline-banner" id="offlineBanner">⚠️ Offline – changes will sync when reconnected</div>
  <header>
    <h1>📅 <span>PA</span> Calendar</h1>
    <div class="user-bar" id="userBar">
      <button class="btn-outline btn-sm" onclick="handleAuth()" id="authBtn">🔗 Connect</button>

  </div>

<script>
// ========== CONFIGURATION – Your calendar ID and sync pace ==========
const CONFIG={
  CLIENT_ID:'276309131384-dtugf0pjg1p4ukludc4a72hbqe4hthgu.apps.googleusercontent.com',
  WORKER_URL:'https://pa-calendar-api.claytongreenberg.workers.dev',
  YOUR_EMAIL:'claytongreenberg@gmail.com',
  GINGER_EMAIL:'greenbergginger@gmail.com',
  WORK_EMAIL:'cgreenberg@lmlawyers.com',
  CONFLICT_BUFFER_HOURS:2,
  EVENT_DURATION_MINUTES:60,
  TIMEZONE:'America/Chicago',
  TARGET_CALENDAR_ID:'da96b17f48347eb003c0132f56e050aa7baa0d4570a0b8d5c0833452d3296fc0@group.calendar.google.com',
  SYNC_DELAY_MS: 15 * 60 * 1000  // 15 minutes = 2 pushes per 30 minutes
};

// Helper to build the calendar events URL
function calEventsURL(suffix='') {
  return `/calendar/v3/calendars/${CONFIG.TARGET_CALENDAR_ID}/events${suffix}`;
}

const STORAGE_KEY='pa-calendar-app-data';
function gid(){return'ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
let isOnline=navigator.onLine;
window.addEventListener('online',()=>{isOnline=true;document.getElementById('offlineBanner').style.display='none';processOfflineQueue()});
window.addEventListener('offline',()=>{isOnline=false;document.getElementById('offlineBanner').style.display='block'});
const offlineQueue=[];
let lastPushTime = 0;
async function processOfflineQueue(){
  while(offlineQueue.length && isOnline){
    const now = Date.now();
    const timeToWait = Math.max(0, CONFIG.SYNC_DELAY_MS - (now - lastPushTime));
    if(timeToWait > 0){
      await new Promise(r => setTimeout(r, timeToWait));
    }
    const t = offlineQueue.shift();
    try{await t()}catch(e){console.error('Offline task failed:',e)}
    lastPushTime = Date.now();
  }
}

// Storage with timeout
function fetchWithTimeout(resource,options,timeout=5000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Storage request timed out')),timeout);fetch(resource,options).then(r=>{clearTimeout(timer);resolve(r)}).catch(e=>{clearTimeout(timer);reject(e)})})}
window.storage={_base:CONFIG.WORKER_URL+'/storage',async get(key){try{const r=await fetchWithTimeout(this._base+'?key='+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+(state.accessToken||'')}});if(!r.ok)return null;const text=await r.text();return text?{value:text}:null}catch(e){return null}},async set(key,value){try{const r=await fetchWithTimeout(this._base+'?key='+encodeURIComponent(key),{method:'PUT',headers:{'Authorization':'Bearer '+(state.accessToken||''),'Content-Type':'text/plain'},body:value});return r.ok}catch(e){return false}},async delete(key){try{const r=await fetchWithTimeout(this._base+'?key='+encodeURIComponent(key),{method:'DELETE',headers:{'Authorization':'Bearer '+(state.accessToken||'')}});return r.ok}catch(e){return false}}};

// ---------- FIXED: proper error parsing & retry flag ----------
async function apiCall(path,options={},_retried){
  const url=CONFIG.WORKER_URL+path;
  const headers={'Authorization':'Bearer '+state.accessToken,'Content-Type':'application/json'};
  if(options.headers)Object.assign(headers,options.headers);
  const fetchOptions={method:options.method||'GET',headers:headers};
  if(options.body)fetchOptions.body=options.body;
  const response=await fetch(url,fetchOptions);
  const text=await response.text();
  if(!response.ok){
    if(response.status===401&&!_retried&&tokenClient){
      try{await refreshGoogleToken();return apiCall(path,options,true)}catch(refreshErr){console.warn('Token refresh failed:',refreshErr)}
    }
    let errorMsg='API error';
    try{
      const errData=JSON.parse(text);
      if(errData?.error){
        errorMsg = typeof errData.error === 'string' ? errData.error : (errData.error.message || 'Unknown API error');
      }
    }catch(e){}
    const err = new Error('('+response.status+') '+errorMsg);
    err.retryable = response.status===429||response.status===403||response.status>=500;
    throw err;
  }
  return text ? JSON.parse(text) : {};
}

async function refreshGoogleToken(){
  if(!tokenClient)throw new Error('Token client not loaded');
  return new Promise((resolve,reject)=>{
    const oc=tokenClient.callback;
    tokenClient.callback=(resp)=>{
      tokenClient.callback=oc;
      if(resp.error)reject(new Error(resp.error));
      else{state.accessToken=resp.access_token;resolve(resp.access_token)}
    };
    tokenClient.requestAccessToken({prompt:''});
  });
}

let calendarQueue=Promise.resolve();
function enqueueCalendarTask(fn){const task=calendarQueue.catch(()=>{}).then(()=>new Promise(r=>setTimeout(r,300))).then(fn);calendarQueue=task.catch(()=>{});return task}
const inFlight=new Set();
function setInFlight(id,v){v?inFlight.add(id):inFlight.delete(id);updateAllButtons()}
function updateAllButtons(){document.querySelectorAll('.event-card').forEach(c=>{const m=c.getAttribute('onclick')?.match(/editEvent\('(.*?)'\)/);if(m){const busy=inFlight.has(m[1]);c.querySelectorAll('button').forEach(b=>{b.disabled=busy||!isOnline})}})}

const DEFAULT_ADMIN={categories:['Champion Sports','Lake Highlands Girls Basketball','Parish Baseball','Parish Boys Basketball','Parish Boys Lacrosse','Parish Football','Parish Girls Basketball','Parish Girls Lacrosse','Parish Soccer','Parish Softball','Parish Volleyball','Premier Events USA','Shelton Baseball','Shelton Football','Other'],paymentOptions:['Paid on Spot','Paid Later','Volunteer (Free)'],defaultPayment:'Paid Later',emojis:{'Lake Highlands Girls Basketball':'🔴','Parish Boys Basketball':'🏀','Parish Girls Basketball':'🔵','Parish Football':'🏈','Shelton Football':'🏈','Shelton Baseball':'⚾','Parish Baseball':'⚾','Parish Softball':'🥎','Parish Soccer':'⚽','Parish Boys Lacrosse':'🥍','Parish Girls Lacrosse':'🥍','Parish Volleyball':'🏐','Premier Events USA':'🏆','Champion Sports':'🏆','Other':'📅'}};
let state={accessToken:null,user:null,events:[],activeTab:'month',weekStart:null,selectedDay:null,adminSettings:JSON.parse(JSON.stringify(DEFAULT_ADMIN)),showAllUpcoming:false,showDeclined:true,showResolvedConflicts:false,selectedCategory:null,syncInProgress:false,notifiedToday:new Set(),lastSyncTime:null};

    if(!Array.isArray(state.adminSettings.categories)||state.adminSettings.categories.length===0){state.adminSettings.categories=[...DEFAULT_ADMIN.categories]}

    category:ev.category||'Other',opponent:ev.opponent||'',location:ev.location||'',

}
function isValidDateStr(s){if(!s||typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00');return!isNaN(d.getTime())}

async function loadState(){
  if(!window.storage){console.warn('window.storage unavailable');return}
  try{
    const result=await window.storage.get(STORAGE_KEY);
    if(result&&result.value){
      const p=JSON.parse(result.value);
      state.events=Array.isArray(p.events)?p.events:[];
      state.adminSettings=p.adminSettings||JSON.parse(JSON.stringify(DEFAULT_ADMIN));
      state.showDeclined=p.showDeclined!==undefined?p.showDeclined:true;
      state.lastSyncTime=p.lastSyncTime||null;
    }
  }catch(e){console.log('No existing PA Calendar data found:',e)}
}

let saveInFlight=false,savePending=false,saveIndicatorTimer=null;

async function saveState(){
  if(!window.storage)return;
  if(saveInFlight){savePending=true;return}
  saveInFlight=true;flashSaveIndicator();
  try{
    const payload=JSON.stringify({events:state.events,adminSettings:state.adminSettings,showDeclined:state.showDeclined,lastSyncTime:state.lastSyncTime});

    if(!ok)console.warn('Storage set returned false')

    await loadState();

function isDuplicate(e1,e2){if(e1.id===e2.id)return false;const n=e=>({date:e.date,startTime:e.startTime||'',category:(e.category||'').trim().toLowerCase(),opponent:(e.opponent||'').trim().toLowerCase().replace(/^vs\s+/i,'')});const a=n(e1),b=n(e2);return a.date===b.date&&a.startTime===b.startTime&&a.category===b.category&&a.opponent===b.opponent}

function fmtTime(e){if(!e.startTime)return'';const[h,m]=e.startTime.split(':');const hr=parseInt(h);return(hr>12?hr-12:(hr===0?12:hr))+':'+m+' '+(hr>=12?'PM':'AM')}
function getDateRange(e){if(!e.endDate||e.endDate===e.date)return fmtDate(e.date);return fmtDate(e.date)+' – '+fmtDate(e.endDate)}

function evConflict(e1,e2){if(e1.id===e2.id)return false;if(isDuplicate(e1,e2))return false;const s1=e1.date,s2=e2.date,e1e=e1.endDate||e1.date,e2e=e2.endDate||e2.date;if(s1>e2e||s2>e1e)return false;if(!e1.endDate&&!e2.endDate&&e1.startTime&&e2.startTime){const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+(m||0)};const start1=toMin(e1.startTime),start2=toMin(e2.startTime);const end1=start1+CONFIG.EVENT_DURATION_MINUTES,end2=start2+CONFIG.EVENT_DURATION_MINUTES;const buf=CONFIG.CONFLICT_BUFFER_HOURS*60;return(start1<end2+buf)&&(start2<end1+buf)}const t1=e1.startTime||'00:00',t2=e2.startTime||'00:00';const d1=new Date('2000-01-01T'+t1),d2=new Date('2000-01-01T'+t2);const b=CONFIG.CONFLICT_BUFFER_HOURS*3600000,d=CONFIG.EVENT_DURATION_MINUTES*60000;return(d1.getTime()-b)<(d2.getTime()+d+b)&&(d2.getTime()-b)<(d1.getTime()+d+b)}

function to24hour(t){if(!t)return'';var match=t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);if(!match)return t;var h=parseInt(match[1],10);var m=match[2];var ampm=(match[3]||'').toUpperCase();if(ampm==='PM'&&h<12)h+=12;if(ampm==='AM'&&h===12)h=0;return String(h).padStart(2,'0')+':'+m}

async function updateConflictState(){const eventsByDate={};for(const ev of state.events){ev.hasConflict=false;ev.conflictWith=[];if(ev._conflictCleared)continue;if(ev.status==='declined')continue;if(!eventsByDate[ev.date])eventsByDate[ev.date]=[];eventsByDate[ev.date].push(ev)}const dates=Object.keys(eventsByDate);let counter=0;for(let i=0;i<dates.length;i++){const dayEvents=eventsByDate[dates[i]];if(dayEvents.length<2)continue;for(let j=0;j<dayEvents.length;j++){for(let k=j+1;k<dayEvents.length;k++){if(evConflict(dayEvents[j],dayEvents[k])){dayEvents[j].hasConflict=true;dayEvents[k].hasConflict=true;dayEvents[j].conflictWith.push(dayEvents[k].id);dayEvents[k].conflictWith.push(dayEvents[j].id)}}}counter++;if(counter%5===0)await new Promise(r=>setTimeout(r,0))}updateConflictUI()}
function updateConflictUI(){const badge=document.getElementById('conflictBadge');if(!badge)return;const active=state.events.filter(ev=>ev.hasConflict&&ev.status!=='declined'&&!ev._conflictCleared);const count=active.length;if(count>0){badge.textContent=count;badge.style.display='block'}else{badge.style.display='none'}}

function addEvent(d,skipSync){
  const ev={id:gid(),date:d.date,startTime:d.startTime||'',endDate:d.endDate||'',category:d.category,opponent:d.opponent||'',location:d.location||'',notes:d.notes||'',noSpotify:d.noSpotify||false,paymentStatus:d.paymentStatus||state.adminSettings.defaultPayment,paymentAmount:d.paymentAmount||'',paymentPaid:false,status:'pending',calendarEventId:null,createdAt:new Date().toISOString(),_conflictCleared:false,_declinedFrom:null,hasConflict:false,conflictWith:[],_pushRetries:0};
  if(!skipSync&&state.events.some(e=>isDuplicate(e,ev)))toast('⚠️ Possible duplicate!','info');

  if(d.category&&!state.adminSettings.categories.includes(d.category))state.adminSettings.categories.push(d.category);
  saveState();
  if(!skipSync){updateConflictState().then(()=>renderAll())}
  return ev;
}
function updateEvent(id,upd){
  const idx=state.events.findIndex(e=>e.id===id);
  if(idx===-1)return;
  Object.assign(state.events[idx],upd);
  const ev=state.events[idx];
  if(upd.status==='declined'){
    if(ev.calendarEventId){deleteFromCal(ev);ev.calendarEventId=null}
  }else if(upd.status==='confirmed'||upd.status==='pending'){
    if(isOnline){
      if(!ev.calendarEventId)pushToCal(ev);
      else updateCalEvent(ev);
    }else{
      toast('Offline – will sync later','info');
      offlineQueue.push(()=>{if(!ev.calendarEventId)pushToCal(ev);else updateCalEvent(ev)});
    }
  }
  saveState();updateConflictState().then(()=>renderAll());
}
function deleteEvent(id){
  const ev=state.events.find(e=>e.id===id);
  if(ev?.calendarEventId)deleteFromCal(ev);
  state.events=state.events.filter(e=>e.id!==id);
  saveState();updateConflictState().then(()=>renderAll());toast('Deleted','info');
}
async function confirmEvent(id){
  const ev=state.events.find(e=>e.id===id);
  if(!ev)return;
  const overlaps=state.events.filter(e=>e.id!==id&&e.status==='confirmed'&&evConflict(ev,e));
  if(overlaps.length&&!confirm('⚠️ Overlaps with confirmed:\n'+overlaps.map(e=>getTitle(e)).join(', ')+'\n\nConfirm anyway?'))return;
  if(!ev.calendarEventId&&isOnline){
    try{await pushToCal(ev)}catch(e){toast('Failed to push to Google Calendar.','error');return}
  }
  if(!ev.calendarEventId){toast('Cannot confirm while offline.','error');return}
  updateEvent(id,{status:'confirmed'});
  toast('Confirmed! ✅','success');
}
function declineEvent(id){
  const ev=state.events.find(e=>e.id===id);
  if(!ev)return;
  if(ev.calendarEventId)deleteFromCal(ev);
  updateEvent(id,{status:'declined',calendarEventId:null});
  toast('Declined ❌','info');
}
function restoreEvent(id){updateEvent(id,{status:'pending'});toast('Restored','info')}
function resolveConflict(keepId,declineId){
  const keep=state.events.find(e=>e.id===keepId),dec=state.events.find(e=>e.id===declineId);
  if(!keep||!dec)return;
  updateEvent(keepId,{status:'confirmed',_declinedFrom:declineId});
  updateEvent(declineId,{status:'declined'});
  keep.notes=keep.notes?keep.notes+'\n⚠️ Declined: "'+getTitle(dec)+'" on '+getDateRange(dec):'⚠️ Declined: "'+getTitle(dec)+'" on '+getDateRange(dec);
  updateCalEvent(keep);
  saveState();
  toast('Kept "'+getTitle(keep)+'", declined "'+getTitle(dec)+'"','success');
  updateConflictState().then(()=>renderAll());
}
function undoResolution(keepId,declineId){updateEvent(keepId,{status:'pending',_declinedFrom:null});updateEvent(declineId,{status:'pending'});toast('Resolution undone','info')}
async function keepBothEvents(id1,id2){
  const e1=state.events.find(e=>e.id===id1),e2=state.events.find(e=>e.id===id2);
  if(!e1||!e2){toast('Event not found','error');return}
  if(e1.status==='pending')e1.status='confirmed';
  if(e2.status==='pending')e2.status='confirmed';
  e1._conflictCleared=true;e2._conflictCleared=true;
  e1.hasConflict=false;e2.hasConflict=false;
  saveState();await updateConflictState();renderAll();
  toast('✅ Both events confirmed and conflict cleared!','success');
  if(isOnline){
    setTimeout(async()=>{
      if(!e1.calendarEventId)await pushToCal(e1);
      await new Promise(r=>setTimeout(r,500));
      if(!e2.calendarEventId)await pushToCal(e2);
    },1000)
  }else{
    toast('Offline – will sync when reconnected.','info');
    offlineQueue.push(()=>{if(!e1.calendarEventId)pushToCal(e1);if(!e2.calendarEventId)pushToCal(e2)});
  }
}
async function confirmAll(){
  const pending=state.events.filter(e=>e.status==='pending');
  if(!pending.length){toast('No pending events','info');return}
  const conflicts=[],seen=new Set();
  for(const e1 of pending)for(const e2 of pending){
    if(e1.id>=e2.id)continue;
    if(evConflict(e1,e2)&&!seen.has(e1.id+'-'+e2.id)){conflicts.push([e1,e2]);seen.add(e1.id+'-'+e2.id)}
  }
  if(conflicts.length){
    let msg='⚠️ Some pending events conflict:\n\n';
    conflicts.forEach(([a,b])=>{msg+='• '+getTitle(a)+' vs '+getTitle(b)+'\n   '+getDateRange(a)+' '+fmtTime(a)+'\n\n'});
    msg+='Resolve these conflicts first.';alert(msg);switchTab('conflicts');return;
  }
  let count=0;
  for(const e of pending){
    if(!e.calendarEventId)await pushToCal(e);
    updateEvent(e.id,{status:'confirmed'});count++;
  }
  saveState();updateConflictState().then(()=>renderAll());toast('Confirmed '+count+' events ✅','success');
}

// ---------- FIXED: retry only on transient errors, stop after 3 ----------
async function pushToCal(ev){
  if(!state.accessToken){toast('Connect Google first!','error');return}
  if(ev.calendarEventId||ev.status==='declined')return;
  if(!isValidDateStr(ev.date)){toast('⚠️ "'+getTitle(ev)+'" has no valid date','error');return}
  if(ev.endDate&&!isValidDateStr(ev.endDate)){ev.endDate=''}
  setInFlight(ev.id,true);
  try{
    await enqueueCalendarTask(async()=>{
      const title=getTitle(ev),ds=ev.date,ts=to24hour(ev.startTime);
      let sd,ed;
      const allDay=!ts;
      if(!allDay){
        sd=new Date(ds+'T'+ts+':00');
        ed=new Date(sd.getTime()+CONFIG.EVENT_DURATION_MINUTES*60000);
      }else{
        sd=new Date(ds+'T00:00:00');
        const rawEnd=ev.endDate||ds;
        const endDateObj=new Date(rawEnd+'T00:00:00');
        endDateObj.setDate(endDateObj.getDate()+1);ed=endDateObj;
      }
      let desc='';
      if(ev.noSpotify)desc+='🚫🎵🚫 SPOTIFY BLOCKED 🚫🎵🚫\n\n⚠️ GINGER - DO NOT USE SPOTIFY OR GOOGLE HOME DURING THIS EVENT ⚠️\n\n';
      if(ev.paymentAmount)desc+='\n💰 Payment: $'+ev.paymentAmount+' ('+ev.paymentStatus+')\n';
      if(ev.notes)desc+='\n📝 '+ev.notes+'\n';
      const body={
        summary:(ev.noSpotify?'🚫🎵 NO SPOTIFY - ':'')+title,
        description:desc,
        start:allDay?{date:ds}:{dateTime:sd.toISOString(),timeZone:CONFIG.TIMEZONE},
        end:allDay?{date:ed.toISOString().split('T')[0]}:{dateTime:ed.toISOString(),timeZone:CONFIG.TIMEZONE},
        attendees:[{email:CONFIG.YOUR_EMAIL},{email:CONFIG.GINGER_EMAIL},{email:CONFIG.WORK_EMAIL}],
        reminders:{useDefault:false,overrides:[
          {method:'popup',minutes:60},{method:'popup',minutes:1440},
          {method:'popup',minutes:morningReminderMinutes(ev)},
          ...(ev.noSpotify?[{method:'popup',minutes:10}]:[])
        ]},
        extendedProperties:{private:{appStatus:ev.status,paymentStatus:ev.paymentStatus,paymentAmount:ev.paymentAmount||'',paymentPaid:String(ev.paymentPaid),noSpotify:String(ev.noSpotify),opponent:ev.opponent||'',location:ev.location||'',notes:ev.notes||'',category:ev.category}}
      };
      const data=await apiCall(calEventsURL('?sendUpdates=none'),{method:'POST',body:JSON.stringify(body)});
      ev.calendarEventId=data.id;
      saveState();
    });
  }catch(e){
    toast('Calendar push failed: '+e.message,'error');
    ev.status='pending';
    saveState();
    const retryCount = ev._pushRetries || 0;
    if(e.retryable && retryCount < 3){
      ev._pushRetries = retryCount + 1;
      offlineQueue.push(()=>pushToCal(ev));
    } else {
      console.warn('Permanent failure or max retries for event, not retrying:', ev, e);
    }
  } finally {
    setInFlight(ev.id,false);
  }
}

async function deleteFromCal(ev){
  if(!state.accessToken||!ev.calendarEventId)return;
  setInFlight(ev.id,true);

async function updateCalEvent(ev){

async function syncWithCalendar(silent){
  if(!state.accessToken||state.syncInProgress)return;
  state.syncInProgress=true;
  if(!silent)toast('Syncing…','info');
  try{
    const now=new Date();
    const tMin=new Date(now.getFullYear()-2,0,1).toISOString(),tMax=new Date(now.getFullYear()+3,11,31).toISOString();
    let events=[],pt=null;
    do{
      let path=calEventsURL('?timeMin='+encodeURIComponent(tMin)+'&timeMax='+encodeURIComponent(tMax)+'&maxResults=2500&singleEvents=true&orderBy=startTime');
      if(pt)path+='&pageToken='+pt;
      const d=await apiCall(path);
      if(d.items)events=events.concat(d.items.filter(isPAEvent));
      pt=d.nextPageToken;
    }while(pt);
    const byId=new Map(),noId=[];
    for(const ev of state.events){
      if(ev.calendarEventId)byId.set(ev.calendarEventId,ev);
      else if(ev.status!=='declined')noId.push(ev);
    }
    const processed=new Set();
    for(const ce of events){
      if(!ce||ce.status==='cancelled')continue;
      processed.add(ce.id);
      const ex=byId.get(ce.id);
      const parsed=parseCalEventToLocal(ce);
      if(ex)Object.assign(ex,parsed,{id:ex.id});
      else{parsed.id=gid();state.events.push(parsed)}
    }
    const toRemove=[];
    for(const[cid,lev]of byId){if(!processed.has(cid))toRemove.push(lev.id)}
    if(toRemove.length){state.events=state.events.filter(e=>!toRemove.includes(e.id));if(!silent)toast('Removed '+toRemove.length+' event(s).','info')}
    for(let i=0;i<noId.length;i++){
      const lev=noId[i];
      try{await pushToCal(lev);if(!silent)toast('Synced: '+getTitle(lev),'success');await new Promise(r=>setTimeout(r,200))}
      catch(e){console.warn('Push failed',lev,e)}
    }
    for(let i=0;i<state.events.length;i++)for(let j=i+1;j<state.events.length;j++){
      if(isDuplicate(state.events[i],state.events[j])){state.events.splice(j,1);j--}
    }
    state.lastSyncTime=new Date().toISOString();
    saveState();await updateConflictState();renderAll();
    if(!silent)toast('Sync complete ✅','success');
  }catch(e){
    console.error('Sync failed:',e);
    if(!silent)toast('Sync error: '+e.message,'error');
  }finally{state.syncInProgress=false}
}

function parseCalEventToLocal(calEvent){
  const priv=calEvent.extendedProperties?.private||{};
  const title=calEvent.summary||'';
  const isAllDay=calEvent.start?.date&&!calEvent.start?.dateTime;
  const start=isAllDay?calEvent.start.date:calEvent.start?.dateTime;
  const end=calEvent.end?(calEvent.end.date||calEvent.end.dateTime):start;
  const dateObj=new Date(start);
  const dateStr=dateObj.toISOString().split('T')[0];
  const startTime=isAllDay?'':dateObj.toTimeString().slice(0,5);
  let endDate='';
  if(end&&end!==start){
    const eo=new Date(end);
    eo.setDate(eo.getDate()-1);
    endDate=eo.toISOString().split('T')[0];
  }
  const cleanTitle=title.replace(/^PA\s+/i,'').replace(/^🚫🎵 NO SPOTIFY - /,'').replace(/^⭐ /,'');
  let category=priv.category||'';
  if(!category){const f=findCategoryInTitle(cleanTitle);category=f||'Other'}
  let opponent=priv.opponent||'';
  if(!opponent){
    opponent=cleanTitle;
    const cr=new RegExp('\\b'+escapeRegExp(category)+'\\b','i');
    opponent=opponent.replace(cr,'').replace(/^[\s-]+|[\s-]+$/g,'').replace(/^vs\s+/i,'');
  }
  return{id:null,date:dateStr,startTime,endDate,category,opponent,location:priv.location||'',notes:priv.notes||'',noSpotify:priv.noSpotify==='true'||title.includes('NO SPOTIFY'),paymentStatus:priv.paymentStatus||'Paid Later',paymentAmount:priv.paymentAmount||'',paymentPaid:priv.paymentPaid==='true',status:priv.appStatus||'confirmed',calendarEventId:calEvent.id,createdAt:new Date().toISOString(),_conflictCleared:false,_declinedFrom:null,hasConflict:false,conflictWith:[],_pushRetries:0};
}
function morningReminderMinutes(ev) {
  if (!ev.startTime) return 480;
  const ts = to24hour(ev.startTime);       // reuse the helper you already have
  if (!ts || !ts.includes(':')) return 480; // fallback
  const [h, m] = ts.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return 480;
  const diff = (h * 60 + m) - (8 * 60);
  return diff <= 0 ? 60 : diff;
}

function renderAdmin(){const c=document.getElementById('content'),all=state.events,today=new Date().toISOString().split('T')[0];const upc=all.filter(e=>(e.date>=today||(e.endDate&&e.endDate>=today))&&e.status!=='declined').length;let earned=0,due=0;for(const e of all){const a=parseFloat(e.paymentAmount)||0;if(e.paymentStatus==='Paid ✅')earned+=a;else if(e.paymentStatus==='Paid Later')due+=a}const lastSync=state.lastSyncTime?new Date(state.lastSyncTime).toLocaleString():'Never';c.innerHTML='<h2>⚙️ Admin</h2><div class="stats-grid"><div class="stat-card"><div class="stat-num">'+all.length+'</div><div class="stat-label">Total</div></div><div class="stat-card"><div class="stat-num">'+upc+'</div><div class="stat-label">Active</div></div><div class="stat-card"><div class="stat-num" style="color:var(--success);">$'+earned.toFixed(0)+'</div><div class="stat-label">Earned</div></div><div class="stat-card"><div class="stat-num" style="color:var(--warning);">$'+due.toFixed(0)+'</div><div class="stat-label">Due</div></div></div><div class="admin-section"><h3>📂 Categories</h3>'+state.adminSettings.categories.map(c=>'<span class="chip">'+c+' <span class="remove-chip" onclick="removeCat(\''+c.replace(/'/g,"\\'")+'\')">×</span></span>').join('')+'<div style="display:flex;gap:4px;margin-top:6px;"><input type="text" id="newCat" placeholder="New..." style="flex:1;"><button class="btn-primary btn-sm" onclick="addCat()">Add</button></div></div><div class="admin-section"><h3>🎨 Emojis</h3>'+state.adminSettings.categories.map(c=>'<div class="emoji-admin-row"><input type="text" value="'+(state.adminSettings.emojis[c]||'')+'" onchange="updateEmoji(\''+c.replace(/'/g,"\\'")+'\',this.value)" placeholder="⭐"><span class="cat-label">'+c+'</span></div>').join('')+'</div><div class="admin-section"><h3>💰 Payment</h3><div>'+state.adminSettings.paymentOptions.map(p=>'<span class="chip">'+p+' '+(state.adminSettings.paymentOptions.length>1?'<span class="remove-chip" onclick="removePay(\''+p.replace(/'/g,"\\'")+'\')">×</span>':'')+'</span>').join('')+'</div><div style="display:flex;gap:4px;margin-top:6px;"><input type="text" id="newPay" placeholder="New..." style="flex:1;"><button class="btn-primary btn-sm" onclick="addPay()">Add</button></div><div class="form-group" style="margin-top:8px;"><label>Default</label><select id="defPay" onchange="updateDefPay()">'+state.adminSettings.paymentOptions.map(p=>'<option value="'+p+'" '+(p===state.adminSettings.defaultPayment?'selected':'')+'>'+p+'</option>').join('')+'</select></div></div><div class="admin-section"><h3>💾 Backup</h3><button class="btn-outline btn-sm" onclick="exportData()">📥 Download</button><button class="btn-outline btn-sm" onclick="importBackup()">📤 Restore</button></div><div class="admin-section"><h3>🔧 Actions</h3><button class="btn-outline btn-sm" onclick="showQuickAddUI()">📥 Quick Add Schedule</button><button class="btn-outline btn-sm" onclick="showDuplicatesUI()">👯 Find Duplicates</button><button class="btn-outline btn-sm" onclick="runCalendarAudit()">🔍 Audit Calendar</button><button class="btn-outline btn-sm" onclick="cleanGoogleCalendar()">🧹 Clean Google Calendar</button><button class="btn-danger btn-sm" onclick="deleteAllGoogleEvents()">🔥 Delete ALL Google Events</button><button class="btn-outline btn-sm" onclick="syncWithCalendar(false)">🔄 Force Sync</button><button class="btn-danger btn-sm" onclick="nuclearWipe()">🗑️ Nuclear Wipe</button></div><div class="admin-section"><h3>📡 Sync Status</h3><p style="font-size:0.85rem;color:var(--text2);">Last synced: '+lastSync+'</p></div>'}

function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=re=>{try{const d=JSON.parse(re.target.result);if(d.events)state.events=d.events;if(d.adminSettings)state.adminSettings=d.adminSettings;repairState();saveState();renderAll();updateConflictUI();toast('Restored!','success')}catch(ex){toast('Invalid file','error')}};r.readAsText(f)};i.click()}
function showQuickAddUI(){document.getElementById('content').innerHTML='<div class="card"><h2>📥 Quick Add Schedule</h2><textarea id="quickAddInput" rows="16" placeholder="Paste your events here..."></textarea><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn-primary" onclick="runQuickAdd()">Preview & Add</button><button class="btn-outline" onclick="switchTab(\'month\')">Cancel</button></div><div id="quickAddResults" style="margin-top:12px;"></div></div>'}
function parseFreeText(text){const lines=text.split(/\n/).map(l=>l.trim());const events=[];let currentCategory='Other';function isCategoryLine(line){for(const cat of state.adminSettings.categories){if(line.toLowerCase()===cat.toLowerCase()||line.toLowerCase().includes(cat.toLowerCase())){return cat}}return null}function isTimeLine(line){if(!line)return false;const upper=line.toUpperCase();if(upper==='TBD'||upper==='TBA')return true;return/^(\d{1,2})(?::(\d{2}))?\s*(?:AM|PM)?$/i.test(line)}let i=0;while(i<lines.length){const line=lines[i];if(!line){i++;continue}const detectedCat=isCategoryLine(line);if(detectedCat){currentCategory=detectedCat;i++;continue}const rangeMatch=line.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*[-–]\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);const singleMatch=line.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(rangeMatch||singleMatch){let dateStr='',endDateStr='';if(rangeMatch){let m1=parseInt(rangeMatch[1]),d1=parseInt(rangeMatch[2]),y1=parseInt(rangeMatch[3]);let m2=parseInt(rangeMatch[4]),d2=parseInt(rangeMatch[5]),y2=parseInt(rangeMatch[6]);if(y1<100)y1+=2000;if(y2<100)y2+=2000;dateStr=y1+'-'+String(m1).padStart(2,'0')+'-'+String(d1).padStart(2,'0');endDateStr=y2+'-'+String(m2).padStart(2,'0')+'-'+String(d2).padStart(2,'0')}else{let m=parseInt(singleMatch[1]),d=parseInt(singleMatch[2]);let y=singleMatch[3]?parseInt(singleMatch[3]):null;if(y&&y<100)y+=2000;const now=new Date();if(!y){y=now.getFullYear();if(m<now.getMonth()+1||(m===now.getMonth()+1&&d<now.getDate())){y+=1}}dateStr=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}let opponent=(i+1<lines.length)?lines[i+1]:'';if(/\d{1,2}\/\d{1,2}/.test(opponent)||isCategoryLine(opponent))opponent='';let notes='';if(opponent.includes('*')){const dashMatch=opponent.match(/^(.*?)\s*[-–]\s*(.*)$/);if(dashMatch){opponent=dashMatch[1].trim();notes=dashMatch[2].trim()}}let location='Home';let startTime='';let nextLine=(i+2<lines.length)?lines[i+2]:'';let timeLine=(i+3<lines.length)?lines[i+3]:'';if(isTimeLine(nextLine)){startTime=nextLine}else if(nextLine&&!isCategoryLine(nextLine)&&!/\d{1,2}\/\d{1,2}/.test(nextLine)){location=nextLine;if(timeLine&&isTimeLine(timeLine)){startTime=timeLine}}else{location='Home';startTime=''}if(startTime&&(startTime.toUpperCase()==='TBD'||startTime.toUpperCase()==='TBA')){startTime=''}if(startTime&&!/AM|PM/i.test(startTime)){var tm=startTime.match(/^(\d{1,2}):(\d{2})$/);if(tm){var hh=parseInt(tm[1],10);if(hh<12)hh+=12;startTime=String(hh).padStart(2,'0')+':'+tm[2]}}if(opponent&&!/^\d/.test(opponent)){events.push({date:dateStr,endDate:endDateStr,startTime:startTime,category:currentCategory,opponent:opponent,location:location,noSpotify:false,paymentStatus:'',paymentAmount:'',notes:notes})}i+=4}else{i++}}return events}
async function runQuickAdd(){const text=document.getElementById('quickAddInput').value.trim();if(!text){toast('Paste text first','error');return}const events=parseFreeText(text);if(!events.length){document.getElementById('quickAddResults').innerHTML='<p style="color:var(--danger);">No events could be parsed.</p>';return}let html='<p style="color:var(--success);">Found '+events.length+' events:</p>';events.forEach((ev)=>{const exists=state.events.some(e=>isDuplicate(e,ev));const dateDisplay=ev.endDate?ev.date+' → '+ev.endDate:ev.date;html+='<div class="val-item '+(exists?'val-match':'val-missing')+'" style="margin:4px 0;"><span>'+(exists?'✅':'➕')+'</span> '+dateDisplay+' — '+ev.opponent+' '+(ev.startTime?' @ '+ev.startTime:' (All Day)')+' ('+ev.category+') '+(exists?'<span style="font-size:0.7rem;color:var(--success);">Exists</span>':'<button class="btn-success btn-xs" onclick="addSingleEvent('+JSON.stringify(ev).replace(/"/g,'&quot;')+'); this.textContent=\'Added!\'; this.disabled=true;">Add</button>')+'</div>'});html+='<div style="margin-top:8px;"><button class="btn-primary btn-sm" onclick="addAllNewEvents('+JSON.stringify(events).replace(/"/g,'&quot;')+');">Add All New</button> <button class="btn-outline btn-sm" onclick="renderAll()">Done</button></div>';document.getElementById('quickAddResults').innerHTML=html}
function addSingleEvent(ev){const newEv=addEvent({date:ev.date,startTime:ev.startTime,endDate:ev.endDate||'',category:ev.category,opponent:ev.opponent,location:ev.location||'Home',notes:ev.notes||'',noSpotify:false,paymentStatus:state.adminSettings.defaultPayment,paymentAmount:''},true);if(isOnline){pushToCal(newEv).catch(()=>{})}else offlineQueue.push(()=>pushToCal(newEv));toast('Added: '+ev.opponent,'success')}
async function addAllNewEvents(events){let count=0;for(const ev of events){if(!state.events.some(e=>isDuplicate(e,ev))){addEvent({date:ev.date,startTime:ev.startTime,endDate:ev.endDate||'',category:ev.category,opponent:ev.opponent,location:ev.location||'Home',notes:ev.notes||'',noSpotify:false,paymentStatus:state.adminSettings.defaultPayment,paymentAmount:''},true);count++}}saveState();await updateConflictState();renderAll();document.getElementById('quickAddResults').innerHTML='<p style="color:var(--success);">✅ Added '+count+' events. Syncing with Google Calendar...</p>';for(const ev of state.events){if(ev.status!=='declined'&&!ev.calendarEventId){try{await pushToCal(ev);await new Promise(r=>setTimeout(r,200))}catch(e){console.warn('Push failed',ev,e)}}}toast('Sync complete','success')}
function showDuplicatesUI(){const c=document.getElementById('content');c.innerHTML='<div class="card"><h2>👯 Find Duplicates</h2><div id="dupesReport" style="margin-top:12px;"></div></div>';const groups=findAllDuplicates();let html='';if(groups.length===0){html='<p>No duplicates found!</p>'}else{html+='<p>Found '+groups.length+' group(s):</p>';groups.forEach((group,idx)=>{html+='<div style="margin-bottom:12px;border:1px solid var(--warning);border-radius:8px;padding:10px;"><h4>Group '+(idx+1)+' – '+getDateRange(group[0])+'</h4>';group.forEach(ev=>{html+='<div class="val-item val-mismatch"><span>'+getTitle(ev)+'</span><div class="val-actions"><button class="btn-danger btn-xs" onclick="deleteEvent(\''+ev.id+'\');showDuplicatesUI();">Delete</button></div></div>'});html+='<button class="btn-warning btn-sm" onclick="deleteAllButFirst('+JSON.stringify(group.map(e=>e.id))+');">Keep First, Delete Rest</button></div>'})}html+='<button class="btn-outline btn-sm" onclick="renderAll()">Back</button>';document.getElementById('dupesReport').innerHTML=html}
function findAllDuplicates(){const groups=[];const used=new Set();for(const e1 of state.events){if(used.has(e1.id))continue;const group=[e1];for(const e2 of state.events){if(e1.id===e2.id||used.has(e2.id))continue;if(isDuplicate(e1,e2)){group.push(e2);used.add(e2.id)}}if(group.length>1){groups.push(group);used.add(e1.id)}}return groups}
function deleteAllButFirst(ids){if(!ids||ids.length<2)return;for(let i=1;i<ids.length;i++)deleteEvent(ids[i]);toast('Kept first, deleted '+(ids.length-1)+' duplicates','success');showDuplicatesUI()}
async function deleteAllGoogleEvents(){if(!state.accessToken){toast('Connect Google first!','error');return}if(!confirm('⚠️ This will DELETE ALL PA Calendar events from Google Calendar. Continue?'))return;document.getElementById('content').innerHTML='<div class="card"><h2>🔥 Deleting All Google Events</h2><div id="deleteProgress" style="text-align:center;padding:20px;"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:0 auto;"></div><p>Fetching and deleting...</p></div><div id="deleteResults"></div></div>';try{const now=new Date();const tMin=new Date(now.getFullYear()-2,0,1).toISOString();const tMax=new Date(now.getFullYear()+3,11,31).toISOString();let allCalEvents=[],pt=null;do{let path=calEventsURL('?timeMin='+encodeURIComponent(tMin)+'&timeMax='+encodeURIComponent(tMax)+'&maxResults=2500&singleEvents=true');if(pt)path+='&pageToken='+pt;const d=await apiCall(path);if(d.items)allCalEvents=allCalEvents.concat(d.items.filter(isPAEvent));pt=d.nextPageToken}while(pt);document.getElementById('deleteProgress').innerHTML='<p>Found '+allCalEvents.length+' PA events to delete.</p>';let deleted=0;for(const ce of allCalEvents){try{await apiCall(calEventsURL('/'+ce.id),{method:'DELETE'});deleted++;if(deleted%10===0)document.getElementById('deleteProgress').innerHTML='<p>Deleted '+deleted+' of '+allCalEvents.length+' events...</p>';await new Promise(r=>setTimeout(r,200))}catch(e){console.warn('Failed to delete:',ce.id,e)}}state.events.forEach(ev=>{ev.calendarEventId=null});saveState();document.getElementById('deleteProgress').innerHTML='';document.getElementById('deleteResults').innerHTML='<div class="conflict-banner" style="background:rgba(102,187,106,0.15);border-color:var(--success);"><span>✅</span><span>Deleted '+deleted+' events from Google Calendar!</span></div><button class="btn-outline btn-sm" onclick="renderAll()" style="margin-top:8px;">Back to Calendar</button><button class="btn-outline btn-sm" onclick="runCalendarAudit()" style="margin-top:8px;">Run Audit</button>';toast('Deleted '+deleted+' events from Google Calendar','success')}catch(e){document.getElementById('deleteProgress').innerHTML='<p style="color:var(--danger);">Error: '+e.message+'</p>'}}
async function cleanGoogleCalendar(){if(!state.accessToken){toast('Connect Google first!','error');return}if(!confirm('This will delete ALL PA Calendar events from Google Calendar that are not in the app. Continue?'))return;document.getElementById('content').innerHTML='<div class="card"><h2>🧹 Cleaning Google Calendar</h2><div id="cleanProgress" style="text-align:center;padding:20px;"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:0 auto;"></div><p>Fetching Google Calendar events...</p></div><div id="cleanResults"></div></div>';try{const now=new Date();const tMin=new Date(now.getFullYear()-2,0,1).toISOString();const tMax=new Date(now.getFullYear()+3,11,31).toISOString();let allCalEvents=[],pt=null;do{let path=calEventsURL('?timeMin='+encodeURIComponent(tMin)+'&timeMax='+encodeURIComponent(tMax)+'&maxResults=2500&singleEvents=true');if(pt)path+='&pageToken='+pt;const d=await apiCall(path);if(d.items)allCalEvents=allCalEvents.concat(d.items.filter(isPAEvent));pt=d.nextPageToken}while(pt);document.getElementById('cleanProgress').innerHTML='<p>Found '+allCalEvents.length+' PA events on Google Calendar.</p>';const appEventIds=new Set(state.events.filter(e=>e.calendarEventId).map(e=>e.calendarEventId));const toDelete=allCalEvents.filter(ce=>!appEventIds.has(ce.id));if(toDelete.length===0){document.getElementById('cleanResults').innerHTML='<p style="color:var(--success);">✅ Google Calendar is already clean!</p>';return}document.getElementById('cleanProgress').innerHTML='<p>Deleting '+toDelete.length+' orphaned events...</p>';let deleted=0;for(const ce of toDelete){try{await apiCall(calEventsURL('/'+ce.id),{method:'DELETE'});deleted++;if(deleted%10===0)document.getElementById('cleanProgress').innerHTML='<p>Deleted '+deleted+' of '+toDelete.length+' events...</p>';await new Promise(r=>setTimeout(r,200))}catch(e){console.warn('Failed to delete:',ce.id,e)}}document.getElementById('cleanProgress').innerHTML='';document.getElementById('cleanResults').innerHTML='<div class="conflict-banner" style="background:rgba(102,187,106,0.15);border-color:var(--success);"><span>✅</span><span>Deleted '+deleted+' orphaned events!</span></div><button class="btn-outline btn-sm" onclick="renderAll()" style="margin-top:8px;">Back to Calendar</button>';}catch(e){document.getElementById('cleanProgress').innerHTML='<p style="color:var(--danger);">Error: '+e.message+'</p>'}}
async function deleteGoogleEvent(calEventId){if(!state.accessToken){toast('Connect Google first!','error');return}try{await apiCall(calEventsURL('/'+calEventId),{method:'DELETE'});toast('Deleted from Google Calendar','success');runCalendarAudit()}catch(e){toast('Delete failed: '+e.message,'error')}}
async function runCalendarAudit(){if(!state.accessToken){toast('Connect Google first!','error');return}document.getElementById('content').innerHTML='<div class="card"><h2>🔍 Calendar Audit</h2><div id="auditProgress" style="text-align:center;padding:20px;"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:0 auto;"></div><p>Fetching...</p></div><div id="auditResults"></div></div>';try{const now=new Date(),tMin=new Date(now.getFullYear()-2,0,1).toISOString(),tMax=new Date(now.getFullYear()+3,11,31).toISOString();let events=[],pt=null;do{let path=calEventsURL('?timeMin='+encodeURIComponent(tMin)+'&timeMax='+encodeURIComponent(tMax)+'&maxResults=2500&singleEvents=true');if(pt)path+='&pageToken='+pt;const d=await apiCall(path);if(d.items)events=events.concat(d.items.filter(isPAEvent));pt=d.nextPageToken}while(pt);document.getElementById('auditProgress').innerHTML='<p>✅ Fetched '+events.length+' events.</p>';const byId=new Map(),noId=[];for(const ev of state.events){if(ev.calendarEventId)byId.set(ev.calendarEventId,ev);else noId.push(ev)}const calById=new Map();for(const ce of events)calById.set(ce.id,ce);const sync=[],missG=[],missA=[],out=[];for(const[cid,lev]of byId){const ce=calById.get(cid);if(!ce||ce.status==='cancelled')missG.push({local:lev,reason:ce?'Cancelled':'Not found'});else{const d=compareEventDetails(lev,ce);if(d.length)out.push({local:lev,cal:ce,diffs:d});else sync.push({local:lev,cal:ce})}}for(const lev of noId){if(lev.status!=='declined')missG.push({local:lev,reason:'No calendar ID'})}for(const[cid,ce]of calById){if(!byId.has(cid)&&ce.status!=='cancelled')missA.push({cal:ce})}let h='<h3>Audit Results</h3><div class="validation-report">';h+='<div class="stats-grid"><div class="stat-card"><div class="stat-num" style="color:var(--success);">'+sync.length+'</div><div class="stat-label">In Sync</div></div><div class="stat-card"><div class="stat-num" style="color:var(--danger);">'+missG.length+'</div><div class="stat-label">Missing Google</div></div><div class="stat-card"><div class="stat-num" style="color:var(--warning);">'+missA.length+'</div><div class="stat-label">Missing App</div></div><div class="stat-card"><div class="stat-num" style="color:var(--accent2);">'+out.length+'</div><div class="stat-label">Out of Sync</div></div></div>';h+='</div><div style="margin-top:12px;"><button class="btn-outline btn-sm" onclick="renderAll()">Back</button></div>';document.getElementById('auditProgress').style.display='none';document.getElementById('auditResults').innerHTML=h}catch(e){document.getElementById('auditProgress').innerHTML='<div style="color:var(--danger);">❌ '+e.message+'</div>'}}
function compareEventDetails(local,cal){const diffs=[],p=parseCalEventToLocal(cal);if(local.date!==p.date)diffs.push('Date');if(local.startTime!==p.startTime)diffs.push('Time');if(local.category!==p.category)diffs.push('Category');if((local.opponent||'').trim()!==(p.opponent||'').trim())diffs.push('Opponent');if((local.location||'').trim()!==(p.location||'').trim())diffs.push('Location');return diffs}
function importFromAudit(cid){apiCall(calEventsURL('/'+cid)).then(ce=>{const p=parseCalEventToLocal(ce);p.id=gid();state.events.push(p);saveState();toast('Imported: '+getTitle(p),'success');runCalendarAudit()}).catch(e=>{toast('Import failed: '+e.message,'error')})}
function printCurrentView(){const today=new Date().toISOString().split('T')[0];let events=[],title='';if(state.activeTab==='month'&&state.selectedDay){const s=state.selectedDay.toISOString().split('T')[0];events=state.events.filter(e=>e.date<=s&&(e.endDate||e.date)>=s&&e.status!=='declined');title=fmtDateLong(s)}else{events=state.events.filter(e=>(e.date>=today||(e.endDate&&e.endDate>=today))&&e.status!=='declined').sort((a,b)=>a.date.localeCompare(b.date));title='Upcoming Events'}const seen=new Set();events=events.filter(e=>seen.has(e.id)?false:(seen.add(e.id),true));let h='<!DOCTYPE html><html><head><title>PA Calendar</title><style>body{font-family:Arial;margin:1cm;}h1{font-size:18pt;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:8px;}th{background:#f0f0f0;}</style></head><body><h1>'+title+'</h1>';h+=events.length?'<table><tr><th>Date</th><th>Time</th><th>Event</th></tr>'+events.map(e=>'<tr><td>'+getDateRange(e)+'</td><td>'+(e.startTime?fmtTime(e):'All Day')+'</td><td>'+getTitle(e)+'</td></tr>').join('')+'</table>':'<p>No events.</p>';h+='</body></html>';const w=window.open('','_blank');w.document.write(h);w.document.close();w.focus();w.print();setTimeout(()=>w.close(),1000)}
async function nuclearWipe(){if(!confirm('Delete ALL events and settings stored by this app?'))return;state.events=[];state.adminSettings=JSON.parse(JSON.stringify(DEFAULT_ADMIN));state.accessToken=null;state.user=null;try{if(window.storage)await window.storage.delete(STORAGE_KEY)}catch(e){console.warn(e)}renderAll();toast('All app data wiped.','info')}
function requestNotificationPermission(){if(!("Notification"in window)||Notification.permission!=="default")return;Notification.requestPermission()}
function checkForTodayNotifications(){if(!("Notification"in window)||Notification.permission!=="granted")return;const now=new Date(),today=now.toISOString().split('T')[0];for(const ev of state.events.filter(e=>(e.status==='confirmed'||e.status==='pending')&&e.date<=today&&(e.endDate||e.date)>=today)){const key=ev.id+today;if(state.notifiedToday.has(key))continue;let show=false;if(!ev.startTime)show=true;else{const[h,m]=ev.startTime.split(':');const es=new Date(today+'T'+h+':'+m+':00');const diff=es-now;if(diff<=30*60*1000&&diff>-60*60*1000)show=true}if(show){new Notification('📅 '+getTitle(ev),{body:'Today'+(ev.startTime?' at '+fmtTime(ev):'')+(ev.location?' @ '+ev.location:''),icon:''});state.notifiedToday.add(key)}}}

async function init(){try{await loadState();repairState();setWeekStart();if(!state.selectedDay)state.selectedDay=new Date();await updateConflictState();renderAll();loadGis();requestNotificationPermission();setInterval(checkForTodayNotifications,300000);checkForTodayNotifications()}catch(e){console.error('Init error:',e);document.getElementById('content').innerHTML='<div class="card"><h2 style="color:var(--danger);">⚠️ Error</h2><p>'+e.message+'</p><button class="btn-primary" onclick="init()">🔄 Retry</button></div>'}}
function loadGis(){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.CLIENT_ID,scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.email',callback:r=>{if(r.error){if(manualAuthRequested)toast('Auth failed: '+r.error,'error');manualAuthRequested=false;return}manualAuthRequested=false;handleTokenResponse(r)}});gisReady=true}catch(e){console.error('GIS init error:',e);toast('Google auth init failed.','error')}};s.onerror=()=>{console.error('Failed to load Google Identity Services script');toast('⚠️ Google sign-in not available','error')};document.head.appendChild(s)}
window.addEventListener('focus',()=>{if(state.accessToken&&!state.syncInProgress)syncWithCalendar(true)});
setInterval(()=>{if(state.accessToken&&!state.syncInProgress&&document.hasFocus())syncWithCalendar(true)},300000);
setInterval(()=>{if(isOnline&&offlineQueue.length>0)processOfflineQueue()},30000);
setInterval(()=>{if(state.accessToken&&tokenClient)refreshGoogleToken().catch(e=>console.warn('Proactive token refresh failed:',e))},45*60*1000);
init();
</script>
